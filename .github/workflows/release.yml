# Publishes TokenCat.zip (macOS) and TokenCat-Windows.zip as one GitHub Release when the version in build.sh changes on main.
# The in-app updaters read /releases/latest, so the tag (v<version>), the asset names and the zip layouts (TokenCat.app at
# the root; TokenCat.exe and LICENSE as flat entries) are a contract with the apps. A failing Windows build blocks the release.
name: Release

on:
  push:
    branches: [main]
    paths: [build.sh]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a release in progress. GitHub keeps only the newest pending run in a group, so a version bumped and
# pushed while another run is pending is skipped; the newest version is still released.
concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  version:
    name: 버전 확인
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      build: ${{ steps.read.outputs.build }}
      tag: ${{ steps.read.outputs.tag }}
      exists: ${{ steps.read.outputs.exists }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's|.*<key>CFBundleShortVersionString</key><string>\([^<]*\)</string>.*|\1|p' build.sh)
          build=$(sed -n 's|.*<key>CFBundleVersion</key><string>\([^<]*\)</string>.*|\1|p' build.sh)
          if [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || ! $build =~ ^[0-9]+$ ]]; then
            echo "::error file=build.sh::버전을 읽지 못했습니다 (version='$version', build='$build')"
            exit 1
          fi
          tag="v$version"
          # ls-remote exits 2 when the tag is missing; any other failure stops the run.
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null || status=$?
          case $status in
            0) exists=true; echo "::notice::$tag 태그가 이미 있어 릴리스를 건너뜁니다." ;;
            2) exists=false; echo "$tag 릴리스를 만듭니다 (build $build)." ;;
            *) exit "$status" ;;
          esac
          # The release notes list the changes from this version's CHANGELOG.md entry.
          if [[ $exists == false ]] && ! grep -qxF "## $version" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::CHANGELOG.md에 '## $version' 항목이 없습니다."
            exit 1
          fi
          # The new release becomes /releases/latest, which the app compares against: it must be newer than the current one.
          if [[ $exists == false ]]; then
            latest=""
            if ! latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>"$RUNNER_TEMP/latest.err"); then
              if grep -q "HTTP 404" "$RUNNER_TEMP/latest.err"; then latest=""; else cat "$RUNNER_TEMP/latest.err"; exit 1; fi
            fi
            current=${latest#v}
            if [[ -n $current && ( $current == "$version" || $(printf '%s\n' "$current" "$version" | sort -V | tail -n 1) != "$version" ) ]]; then
              echo "::error file=build.sh::$version은 현재 최신 릴리스 $latest보다 새 버전이 아닙니다."
              exit 1
            fi
          fi
          { echo "version=$version"; echo "build=$build"; echo "tag=$tag"; echo "exists=$exists"; } >> "$GITHUB_OUTPUT"

  # The Windows exe must be built on Windows: only there does the SDK write the version resource the updater checks.
  windows:
    name: Windows 빌드
    needs: version
    if: needs.version.outputs.exists == 'false'
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      sha256: ${{ steps.zip.outputs.sha256 }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: windows/global.json

      - name: 빌드
        run: |
          dotnet --info
          dotnet build windows/TokenCat.Windows.slnx -c Release -warnaserror

      - name: 게시
        run: |
          dotnet publish windows/TokenCat.App -c Release -o publish
          if [[ $(ls publish) != TokenCat.exe ]]; then
            echo "::error::publish에 TokenCat.exe 말고 다른 파일이 있습니다: $(ls publish | tr '\n' ' ')"
            exit 1
          fi

      # App checks plus the Core suites (the same Suites.RunAll as TokenCat.Checks).
      - name: 자체 검사
        run: ./publish/TokenCat.exe --self-test

      # The version comes from build.sh through Directory.Build.props; the updater compares it with the tag.
      - name: 버전 확인
        shell: pwsh
        run: |
          $product = (Get-Item publish/TokenCat.exe).VersionInfo.ProductVersion
          if ($product -ne $env:VERSION) { Write-Error "TokenCat.exe ProductVersion '$product'이 태그 버전 ${env:VERSION}과 다릅니다."; exit 1 }

      - name: 압축
        id: zip
        shell: pwsh
        run: |
          Compress-Archive -Path publish/TokenCat.exe, LICENSE -DestinationPath TokenCat-Windows.zip
          $sha256 = (Get-FileHash TokenCat-Windows.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Output "TokenCat-Windows.zip $((Get-Item TokenCat-Windows.zip).Length) bytes, SHA-256 $sha256"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "sha256=$sha256"

      # The updater's steps on this very zip: extract rules, version, rename-replace, relaunch, cleanup.
      - name: 업데이트 자체 검사
        run: ./publish/TokenCat.exe --update-selftest TokenCat-Windows.zip

      - name: 텔레메트리 수명 주기 검사
        run: ./publish/TokenCat.exe --telemetry-lifecycle-checks

      # Renders the fixture dashboard and Settings offscreen: the only step that caught the 0.11.0 first-run card crash.
      - name: 스냅숏
        run: ./publish/TokenCat.exe --snapshot snapshots

      - uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: TokenCat-Windows.zip
          retention-days: 1
          if-no-files-found: error

  release:
    name: 빌드와 릴리스
    needs: [version, windows]
    if: needs.version.outputs.exists == 'false'
    # Newest GA image (macOS 26, arm64). Its default Xcode is the newest stable one installed.
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUILD: ${{ needs.version.outputs.build }}
      TAG: ${{ needs.version.outputs.tag }}
      APP: dist/TokenCat.app
      WINDOWS_SHA256: ${{ needs.windows.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 도구 버전
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: 빌드
        run: ./build.sh

      - name: 자체 검사
        run: |
          "$APP/Contents/MacOS/TokenCat" --self-test
          "$APP/Contents/MacOS/TokenCat" --telemetry-lifecycle-checks
          if /usr/bin/arch -x86_64 /usr/bin/true 2>/dev/null; then
            /usr/bin/arch -x86_64 "$APP/Contents/MacOS/TokenCat" --self-test
          else
            echo "::warning::Rosetta가 없어 x86_64 자체 검사를 건너뜁니다."
          fi

      - name: 아키텍처·버전·서명 확인
        run: |
          binary="$APP/Contents/MacOS/TokenCat"
          archs=$(lipo -archs "$binary")
          echo "archs: $archs"
          if [[ " $archs " != *" arm64 "* || " $archs " != *" x86_64 "* ]]; then
            echo "::error::universal 바이너리가 아닙니다: $archs"
            exit 1
          fi
          for arch in arm64 x86_64; do echo "$arch:"; vtool -arch "$arch" -show-build "$binary" | grep -E 'minos|sdk'; done
          plist="$APP/Contents/Info.plist"
          short=$(plutil -extract CFBundleShortVersionString raw "$plist")
          bundle=$(plutil -extract CFBundleVersion raw "$plist")
          if [[ $short != "$VERSION" || $bundle != "$BUILD" ]]; then
            echo "::error::Info.plist 버전 $short ($bundle)이 태그 $TAG (build $BUILD)와 다릅니다."
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: 압축
        id: zip
        run: |
          ditto -c -k --sequesterRsrc --keepParent "$APP" TokenCat.zip
          sha256=$(shasum -a 256 TokenCat.zip | cut -d ' ' -f 1)
          echo "TokenCat.zip $(stat -f %z TokenCat.zip) bytes, SHA-256 $sha256"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: 릴리스 노트
        env:
          SHA256: ${{ steps.zip.outputs.sha256 }}
        run: |
          repo_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          previous=$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)
          {
            echo "TokenCat is a macOS app whose pixel cat in the menu bar tells you what your Codex and Claude Code sessions are doing right now."
            echo
            echo "TokenCat은 Codex와 Claude Code 세션이 지금 무엇을 하는지 메뉴 막대의 픽셀 고양이로 알려 주는 macOS 앱입니다."
            echo
            echo "A Windows preview that lives in the notification area is attached too · 알림 영역에서 실행되는 Windows 미리보기도 함께 올립니다."
            echo
            echo "## Changes · 변경 사항"
            awk -v heading="## $VERSION" '$0 == heading { on = 1; next } on && /^## / { exit } on' CHANGELOG.md
            echo
            if [[ -n $previous ]]; then
              echo "Full comparison · 전체 비교: [$previous...$TAG]($repo_url/compare/$previous...$TAG)"
            else
              echo "This is the first release. Changes so far are in the [commit history]($repo_url/commits/$TAG)."
              echo
              echo "첫 릴리스입니다. 지금까지의 변경은 [커밋 기록]($repo_url/commits/$TAG)에서 볼 수 있습니다."
            fi
            cat <<NOTES

          ## Install

          Runs on macOS 13 or later, on Apple silicon and Intel Macs (universal).

          1. Download **TokenCat.zip** below, unzip it and move \`TokenCat.app\` to the **Applications** folder.
          2. The app has no Developer ID signature or Apple notarization, so macOS blocks it the first time you open it. You only need to allow it once.
             - **macOS 15 and later**: open the app and click **Done** in the window saying it was blocked. In **System Settings › Privacy & Security**, under **Security**, click **Open Anyway**, then click **Open Anyway** again in the window that appears and confirm with your password.
             - **macOS 13–14**: in Finder, Control-click (or right-click) the app and choose **Open**, then click **Open** again in the confirmation window.
          3. You can also install from the terminal. A file downloaded with curl gets no quarantine attribute, so the windows above don't appear; check first that the SHA-256 matches the value below.

             \`\`\`sh
             curl -fL $repo_url/releases/latest/download/TokenCat.zip -o /tmp/TokenCat.zip \\
               && shasum -a 256 /tmp/TokenCat.zip
             \`\`\`

             If it matches, unzip the new app first, then replace the existing one. If unzipping fails, the existing app isn't removed.

             \`\`\`sh
             rm -rf /tmp/TokenCat-new && ditto -x -k /tmp/TokenCat.zip /tmp/TokenCat-new \\
               && { pkill -x TokenCat; rm -rf /Applications/TokenCat.app; } \\
               && mv /tmp/TokenCat-new/TokenCat.app /Applications/ \\
               && open /Applications/TokenCat.app
             \`\`\`

          If you already use 0.9.0 or later, you can install it right away with the **Update** button at the bottom of the dashboard.

          > **On first launch, TokenCat changes client settings automatically.** To receive measurements, it adds local OTLP settings that send to this Mac (\`127.0.0.1:16493\`) to Codex \`~/.codex/config.toml\` and Claude Code \`~/.claude/settings.json\`, and to receive Claude usage limits, it wraps the Claude Code \`statusLine\` command with the TokenCat bridge (\`~/Library/Application Support/TokenCat/claude-statusline.sh\`). The bridge sends the status JSON only to \`127.0.0.1\` and runs the original command unchanged, so the status line output stays the same. The originals are backed up to \`~/Library/Application Support/TokenCat/telemetry-backups/\` first, and prompt and response text logging is turned off. To undo it, quit TokenCat and run \`/Applications/TokenCat.app/Contents/MacOS/TokenCat --disconnect-telemetry\`. Even if automatic restore is refused because a config file changed after connecting, a status line that is still exactly the bridge command is restored. Don't delete \`~/Library/Application Support/TokenCat/\` while \`settings.json\` still points to \`claude-statusline.sh\`.

          **TokenCat.zip** · universal (arm64 · x86_64) · ad-hoc signed · SHA-256 \`$SHA256\`

          ## Install on Windows (preview)

          Runs on Windows 10 and 11 (x64). There's no installer.

          1. Download **TokenCat-Windows.zip** below. If you right-click it and choose **Properties**, check **Unblock** and click **OK** before extracting, step 3 doesn't appear.
          2. Extract the whole zip (\`TokenCat.exe\` and \`LICENSE\`) to \`%LOCALAPPDATA%\Programs\TokenCat\` and run \`TokenCat.exe\` from there. In PowerShell, \`Expand-Archive "\$HOME\Downloads\TokenCat-Windows.zip" "\$env:LOCALAPPDATA\Programs\TokenCat"\` creates the folder. Run from inside the zip or a temporary folder, it can't update itself.
          3. The app isn't code-signed, so Microsoft Defender SmartScreen may show **Windows protected your PC**. Click **More info**, then **Run anyway** (the wording can differ between Windows versions). With **Smart App Control** on (Windows 11), unsigned apps are blocked with no way to allow a single one; TokenCat runs only with Smart App Control off.
          4. The cat appears in the notification area. Windows 11 puts new icons in the overflow (**^**): drag the cat onto the taskbar, or turn it on in **Settings › Personalization › Taskbar › Other system tray icons**, to keep it in view.

          > **On first launch, TokenCat changes client settings automatically.** It adds local OTLP settings that send to this PC (\`127.0.0.1:16493\`) to Codex \`%USERPROFILE%\.codex\config.toml\` and Claude Code \`%USERPROFILE%\.claude\settings.json\`. If Claude Code has no \`statusLine\`, it sets one to the TokenCat bridge (\`%LOCALAPPDATA%\TokenCat\claude-statusline.ps1\`, run by PowerShell), which sends the status JSON only to \`127.0.0.1\` and prints nothing. An existing \`statusLine\` is left as it is, and usage limits then come from the Claude desktop app's history. The originals are backed up to \`%LOCALAPPDATA%\TokenCat\telemetry-backups\` first, and prompt and response text logging is turned off. To undo it, quit TokenCat and run \`& "\$env:LOCALAPPDATA\Programs\TokenCat\TokenCat.exe" --disconnect-telemetry | Out-Host\` in PowerShell. Sessions running inside WSL aren't tracked yet.

          **TokenCat-Windows.zip** · Windows x64 · not code-signed · SHA-256 \`$WINDOWS_SHA256\`

          More in the README: [Install]($repo_url#install) · [Windows (preview)]($repo_url#windows-preview).

          ---

          ## 설치

          macOS 13 이상, Apple silicon과 Intel Mac에서 실행됩니다(universal).

          1. 아래 **TokenCat.zip**을 내려받아 풀고 \`TokenCat.app\`을 **응용 프로그램** 폴더로 옮깁니다.
          2. Developer ID 서명과 Apple 공증을 하지 않은 앱이라 처음 열 때 macOS가 막습니다. 한 번만 허용하면 됩니다.
             - **macOS 15 이상**: 앱을 열고 막혔다는 창에서 **완료**를 누릅니다. **시스템 설정 › 개인정보 보호 및 보안**의 **보안** 항목에서 **그래도 열기**를 누르고, 다시 나오는 창에서 **그래도 열기**를 누른 뒤 암호로 확인합니다.
             - **macOS 13–14**: Finder에서 앱을 Control-클릭(우클릭)하고 **열기**를 고른 뒤, 확인 창에서 다시 **열기**를 누릅니다.
          3. 터미널로 설치할 수도 있습니다. curl로 받은 파일에는 격리 속성이 붙지 않아 위 확인 창이 나오지 않으므로, 먼저 SHA-256이 아래 값과 같은지 확인합니다.

             \`\`\`sh
             curl -fL $repo_url/releases/latest/download/TokenCat.zip -o /tmp/TokenCat.zip \\
               && shasum -a 256 /tmp/TokenCat.zip
             \`\`\`

             값이 같으면 새 앱을 먼저 풀어 둔 뒤 기존 앱과 바꿉니다. 압축 풀기에 실패하면 기존 앱은 지우지 않습니다.

             \`\`\`sh
             rm -rf /tmp/TokenCat-new && ditto -x -k /tmp/TokenCat.zip /tmp/TokenCat-new \\
               && { pkill -x TokenCat; rm -rf /Applications/TokenCat.app; } \\
               && mv /tmp/TokenCat-new/TokenCat.app /Applications/ \\
               && open /Applications/TokenCat.app
             \`\`\`

          이미 0.9.0 이상을 쓰고 있다면 상세 화면 아래쪽의 **업데이트** 버튼으로 바로 설치할 수 있습니다.

          > **처음 실행하면 클라이언트 설정을 자동으로 바꿉니다.** 실측을 받기 위해 Codex \`~/.codex/config.toml\`과 Claude Code \`~/.claude/settings.json\`에 이 Mac(\`127.0.0.1:16493\`)으로 보내는 로컬 OTLP 전송 설정을 추가하고, Claude 사용 한도를 받기 위해 Claude Code \`statusLine\` 명령을 TokenCat 브리지(\`~/Library/Application Support/TokenCat/claude-statusline.sh\`)로 감쌉니다. 브리지는 상태 JSON을 \`127.0.0.1\`로만 보내고 원래 명령을 그대로 실행하므로 상태 표시줄 출력은 바뀌지 않습니다. 원본은 \`~/Library/Application Support/TokenCat/telemetry-backups/\`에 먼저 백업하고 프롬프트·응답 본문 로깅은 끕니다. 되돌리려면 TokenCat을 종료한 뒤 \`/Applications/TokenCat.app/Contents/MacOS/TokenCat --disconnect-telemetry\`를 실행합니다. 연결 뒤 설정 파일이 바뀌어 자동 복구가 거부돼도 브리지 명령 그대로인 상태 표시줄은 원래대로 되돌립니다. \`settings.json\`이 아직 \`claude-statusline.sh\`를 가리키면 \`~/Library/Application Support/TokenCat/\`을 지우지 마세요.

          **TokenCat.zip** · universal(arm64 · x86_64) · ad-hoc 서명 · SHA-256 \`$SHA256\`

          ## Windows에 설치 (미리보기)

          Windows 10과 11(x64)에서 실행됩니다. 설치 프로그램은 없습니다.

          1. 아래 **TokenCat-Windows.zip**을 내려받습니다. 압축을 풀기 전에 파일을 우클릭해 **속성**에서 **차단 해제**를 체크하고 **확인**을 누르면 3단계가 나오지 않습니다.
          2. zip 전체(\`TokenCat.exe\`와 \`LICENSE\`)를 \`%LOCALAPPDATA%\Programs\TokenCat\`에 풀고 그곳에서 \`TokenCat.exe\`를 실행합니다. PowerShell에서 \`Expand-Archive "\$HOME\Downloads\TokenCat-Windows.zip" "\$env:LOCALAPPDATA\Programs\TokenCat"\`를 실행하면 폴더도 만듭니다. 압축 파일 안이나 임시 폴더에서 실행하면 스스로 업데이트할 수 없습니다.
          3. 코드 서명을 하지 않은 앱이라 Microsoft Defender SmartScreen이 **Windows의 PC 보호** 창을 띄울 수 있습니다. **추가 정보**를 누른 뒤 **실행**을 누릅니다(Windows 버전에 따라 문구가 다를 수 있습니다). Windows 11에서 **스마트 앱 컨트롤**이 켜져 있으면 서명하지 않은 앱을 하나만 허용할 방법이 없어, 스마트 앱 컨트롤을 꺼야 실행됩니다.
          4. 고양이는 알림 영역에 나타납니다. Windows 11은 새 아이콘을 숨겨진 아이콘(**^**)에 넣으므로, 고양이를 작업 표시줄로 끌어 놓거나 **설정 › 개인 설정 › 작업 표시줄 › 기타 시스템 트레이 아이콘**에서 켜면 계속 보입니다.

          > **처음 실행하면 클라이언트 설정을 자동으로 바꿉니다.** Codex \`%USERPROFILE%\.codex\config.toml\`과 Claude Code \`%USERPROFILE%\.claude\settings.json\`에 이 PC(\`127.0.0.1:16493\`)로 보내는 로컬 OTLP 전송 설정을 추가합니다. Claude Code에 \`statusLine\`이 없으면 TokenCat 브리지(\`%LOCALAPPDATA%\TokenCat\claude-statusline.ps1\`, PowerShell로 실행)로 설정합니다. 브리지는 상태 JSON을 \`127.0.0.1\`로만 보내고 아무것도 출력하지 않습니다. 이미 있는 \`statusLine\`은 그대로 두고, 이때 사용 한도는 Claude 데스크톱 앱 기록에서 읽습니다. 원본은 \`%LOCALAPPDATA%\TokenCat\telemetry-backups\`에 먼저 백업하고 프롬프트·응답 본문 로깅은 끕니다. 되돌리려면 TokenCat을 종료한 뒤 PowerShell에서 \`& "\$env:LOCALAPPDATA\Programs\TokenCat\TokenCat.exe" --disconnect-telemetry | Out-Host\`를 실행합니다. WSL 안에서 실행하는 세션은 아직 추적하지 않습니다.

          **TokenCat-Windows.zip** · Windows x64 · 코드 서명 없음 · SHA-256 \`$WINDOWS_SHA256\`

          자세한 내용은 README의 [설치]($repo_url/blob/main/README.ko.md#설치)와 [Windows (미리보기)]($repo_url/blob/main/README.ko.md#windows-미리보기)에 있습니다.
          NOTES
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Windows 자산 받기
        uses: actions/download-artifact@v8
        with:
          name: windows-release

      - name: Windows 자산 확인
        run: |
          actual=$(shasum -a 256 TokenCat-Windows.zip | cut -d ' ' -f 1)
          echo "TokenCat-Windows.zip $(stat -f %z TokenCat-Windows.zip) bytes, SHA-256 $actual"
          if [[ $actual != "$WINDOWS_SHA256" ]]; then
            echo "::error::받은 TokenCat-Windows.zip SHA-256 $actual이 Windows 빌드의 $WINDOWS_SHA256과 다릅니다."
            exit 1
          fi

      # A draft first: no tag and nothing the app can see until its asset digest is checked. A draft left by a failed
      # run (drafts create no tag, so the version job runs again) is deleted before a new one is made.
      - name: 초안 릴리스 만들기
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id"); do
            echo "이전 실행의 $TAG 초안($id)을 지웁니다."
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
          gh release create "$TAG" TokenCat.zip TokenCat-Windows.zip \
            --draft \
            --title "TokenCat $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --target "$GITHUB_SHA"
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id")
          if [[ ! $id =~ ^[0-9]+$ ]]; then
            echo "::error::$TAG 초안을 하나로 찾지 못했습니다: '$id'"
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

      # The apps install only an asset whose GitHub digest matches the file they download.
      - name: 초안 자산 확인
        env:
          GH_TOKEN: ${{ github.token }}
          SHA256: ${{ steps.zip.outputs.sha256 }}
          ID: ${{ steps.draft.outputs.id }}
        run: |
          for asset in "TokenCat.zip=$SHA256" "TokenCat-Windows.zip=$WINDOWS_SHA256"; do
            name=${asset%%=*} expected=${asset#*=} found=false
            for attempt in 1 2 3 4 5 6; do
              digest=$(gh api "repos/$GITHUB_REPOSITORY/releases/$ID" --jq ".assets[] | select(.name == \"$name\") | .digest")
              echo "$name 시도 $attempt: ${digest:-digest 없음}"
              if [[ $digest == "sha256:$expected" ]]; then found=true; break; fi
              sleep 5
            done
            if [[ $found != true ]]; then
              echo "::error::초안의 $name digest가 sha256:$expected과 다릅니다. 게시하지 않았습니다."
              exit 1
            fi
          done

      - name: 게시
        env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ steps.draft.outputs.id }}
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" -F draft=false -f make_latest=true --jq '.html_url'

      # Read back what the app will see: /releases/latest must be this tag with the asset digest it verifies.
      - name: 게시 결과 확인
        env:
          GH_TOKEN: ${{ github.token }}
          SHA256: ${{ steps.zip.outputs.sha256 }}
        run: |
          expected="$TAG"$'\t'false$'\t'false$'\t'"sha256:$SHA256"$'\t'"sha256:$WINDOWS_SHA256"
          for attempt in 1 2 3 4 5 6; do
            latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" \
              --jq '[.tag_name, .draft, .prerelease, (.assets[] | select(.name == "TokenCat.zip") | .digest),
                     (.assets[] | select(.name == "TokenCat-Windows.zip") | .digest)] | @tsv' || true)
            echo "시도 $attempt: $latest"
            [[ $latest == "$expected" ]] && exit 0
            sleep 10
          done
          echo "::error::/releases/latest가 $TAG와 TokenCat.zip·TokenCat-Windows.zip SHA-256을 가리키지 않습니다."
          exit 1
